name: monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tinytuya
      - run: python monitor.py
        env:
          TUYA_KEY: ${{ secrets.TUYA_KEY }}
          TUYA_SECRET: ${{ secrets.TUYA_SECRET }}
          TUYA_INDOOR_IDS: ${{ secrets.TUYA_INDOOR_IDS }}
          TUYA_OUTDOOR_ID: ${{ secrets.TUYA_OUTDOOR_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json data.json history.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -X theirs && git push)
